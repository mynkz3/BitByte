[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bitbyte-catalog"
version = "0.1.0"
description = "Build-time catalog pipeline for BitByte dataset metadata."
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
]

[project.optional-dependencies]
test = [
  "pytest>=8,<9",
  "jsonschema>=4.23,<5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
