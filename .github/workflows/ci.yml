name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: latest

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Install catalog-builder dependencies
        working-directory: catalog_builder
        run: python -m pip install -e ".[test]"

      - name: Typecheck web application
        run: npm run typecheck

      - name: Run web unit tests
        run: npm test -- --run

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Run Rust lints
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run Rust tests
        run: cargo test --workspace

      - name: Run catalog-builder tests
        run: python -m pytest catalog_builder/tests -q

      - name: Build production web application
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run browser end-to-end test
        run: npm run test:e2e
